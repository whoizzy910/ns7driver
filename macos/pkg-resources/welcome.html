<h2>Numark NS7 Driver</h2>
<p>Makes the original Numark NS7 work on this Mac, including Apple Silicon:</p>
<ul><li>"Numark NS7" audio device, 4 in / 4 out (master on 1/2, cue on 3/4)</li>
<li>"NS7" MIDI input and output for mapping in Mixxx, Serato and others</li></ul>
<p>No kernel extension and no security changes are needed.</p>
