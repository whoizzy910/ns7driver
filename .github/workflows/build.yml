name: build
on:
  push:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14            # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install pkg-config cmake || true
      - name: Build, test and package
        run: macos/make-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NS7Driver-pkg
          path: build/NS7Driver-*.pkg
          if-no-files-found: error
